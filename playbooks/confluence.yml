---
- name: Gather system facts and publish documentation to Confluence
  hosts: all
  gather_facts: true
  become: false
  serial: 1

  vars:
    # Confluence configuration
    confluence_email: "aayushdalal12@gmail.com"
    confluence_api_token: "{{ lookup('env', 'CONFLUENCE_API_TOKEN') }}"
    confluence_base_url: "https://aayushdalal12.atlassian.net/wiki/"
    confluence_space_key: "CapstoneSp"

    # Create one Confluence page per target system.
    confluence_page_title: >-
      {{ ansible_facts.get('hostname', inventory_hostname) }} - Infrastructure Documentation

    # Facts used in the generated documentation.
    system_ip: >-
      {{ ansible_facts.get('default_ipv4', {}).get('address', ansible_host | default('N/A')) }}
    system_os: >-
      {{ ansible_facts.get('distribution', 'N/A') }} {{ ansible_facts.get('distribution_version', '') }}
    system_architecture: "{{ ansible_facts.get('architecture', 'N/A') }}"
    system_cpu_count: "{{ ansible_facts.get('processor_vcpus', 'N/A') }}"
    system_memory_mb: "{{ ansible_facts.get('memtotal_mb', 'N/A') }}"
    system_kernel: "{{ ansible_facts.get('kernel', 'N/A') }}"

  pre_tasks:
    - name: Validate required Confluence API token
      ansible.builtin.assert:
        that:
          - confluence_api_token | length > 0
        fail_msg: >-
          CONFLUENCE_API_TOKEN is not set. Export the token in your shell before
          running this playbook. Do not store the token in this file or in Git.
      delegate_to: localhost

    - name: Confirm target facts were gathered
      ansible.builtin.assert:
        that:
          - ansible_facts | length > 0
          - ansible_facts.get('hostname', '') | length > 0
        fail_msg: "Ansible facts were not gathered successfully for {{ inventory_hostname }}."

  tasks:
    - name: Build Confluence page body from gathered facts
      ansible.builtin.set_fact:
        confluence_page_body: |
          <h1>{{ confluence_page_title }}</h1>
          <p>This page was generated automatically from Ansible facts.</p>

          <h2>System Summary</h2>
          <table>
            <tbody>
              <tr><th>Inventory Host</th><td>{{ inventory_hostname }}</td></tr>
              <tr><th>Hostname</th><td>{{ ansible_facts.get('hostname', 'N/A') }}</td></tr>
              <tr><th>IP Address</th><td>{{ system_ip }}</td></tr>
              <tr><th>Operating System</th><td>{{ system_os }}</td></tr>
              <tr><th>Kernel</th><td>{{ system_kernel }}</td></tr>
              <tr><th>Architecture</th><td>{{ system_architecture }}</td></tr>
              <tr><th>Virtual CPUs</th><td>{{ system_cpu_count }}</td></tr>
              <tr><th>Total Memory (MB)</th><td>{{ system_memory_mb }}</td></tr>
            </tbody>
          </table>

          <h2>Automation Details</h2>
          <p>Collected by Ansible and published through the Confluence REST API.</p>

    - name: Verify authentication to Confluence
      ansible.builtin.uri:
        url: "{{ confluence_base_url }}rest/api/space/{{ confluence_space_key }}"
        method: GET
        user: "{{ confluence_email }}"
        password: "{{ confluence_api_token }}"
        force_basic_auth: true
        headers:
          Accept: "application/json"
        return_content: true
        status_code: 200
      delegate_to: localhost
      register: confluence_auth_result
      changed_when: false
      tags:
        - check_connection

    - name: Search for existing documentation page
      ansible.builtin.uri:
        url: >-
          {{ confluence_base_url }}rest/api/content
          ?spaceKey={{ confluence_space_key | urlencode }}
          &title={{ confluence_page_title | urlencode }}
          &expand=version
        method: GET
        user: "{{ confluence_email }}"
        password: "{{ confluence_api_token }}"
        force_basic_auth: true
        headers:
          Accept: "application/json"
        return_content: true
        status_code: 200
      delegate_to: localhost
      register: confluence_page_search
      changed_when: false
      tags:
        - check_page
        - publish

    - name: Ensure page lookup is unambiguous
      ansible.builtin.assert:
        that:
          - confluence_page_search.json.results | length <= 1
        fail_msg: >-
          More than one Confluence page named '{{ confluence_page_title }}' exists
          in space '{{ confluence_space_key }}'. Resolve the duplicate pages before
          rerunning the automation.
      delegate_to: localhost
      tags:
        - check_page
        - publish

    - name: Create Confluence page when it does not exist
      ansible.builtin.uri:
        url: "{{ confluence_base_url }}rest/api/content"
        method: POST
        user: "{{ confluence_email }}"
        password: "{{ confluence_api_token }}"
        force_basic_auth: true
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
        body_format: json
        body:
          type: "page"
          title: "{{ confluence_page_title }}"
          space:
            key: "{{ confluence_space_key }}"
          body:
            storage:
              representation: "storage"
              value: "{{ confluence_page_body }}"
        return_content: true
        status_code:
          - 200
          - 201
      delegate_to: localhost
      register: confluence_page_create
      when: confluence_page_search.json.results | length == 0
      tags:
        - publish

    - name: Update existing Confluence page
      ansible.builtin.uri:
        url: >-
          {{ confluence_base_url }}rest/api/content/
          {{ confluence_page_search.json.results[0].id }}
        method: PUT
        user: "{{ confluence_email }}"
        password: "{{ confluence_api_token }}"
        force_basic_auth: true
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
        body_format: json
        body:
          id: "{{ confluence_page_search.json.results[0].id }}"
          type: "page"
          title: "{{ confluence_page_title }}"
          space:
            key: "{{ confluence_space_key }}"
          body:
            storage:
              representation: "storage"
              value: "{{ confluence_page_body }}"
          version:
            number: "{{ confluence_page_search.json.results[0].version.number | int + 1 }}"
        return_content: true
        status_code:
          - 200
          - 201
      delegate_to: localhost
      register: confluence_page_update
      when: confluence_page_search.json.results | length == 1
      tags:
        - publish

    - name: Report documentation result
      ansible.builtin.debug:
        msg: >-
          Confluence documentation for '{{ inventory_hostname }}' was
          {{ 'created' if (confluence_page_search.json.results | length == 0) else 'updated' }}
          as '{{ confluence_page_title }}' in space '{{ confluence_space_key }}'.
      tags:
        - publish
