---
- name: Automated Cross-Platform Confluence Infrastructure Documentation
  hosts: all
  become: false
  gather_facts: false

  vars:
    confluence_email: "aayushdalal12@gmail.com"
    confluence_api_token: "{{ lookup('env', 'CONFLUENCE_API_TOKEN') }}"
    confluence_base_url: "https://aayushdalal12.atlassian.net/wiki/"
    confluence_space: "CapstoneSp"
    confluence_api_endpoint: "rest/api/content/"

    confluence_page_title: >-
      {{ inventory_hostname }} - Infrastructure Documentation

    confluence_cql: >-
      title="{{ confluence_page_title }}"
      AND space="{{ confluence_space }}"

  pre_tasks:
    - name: Gather Linux and macOS facts securely
      ansible.builtin.setup:
        gather_subset:
          - all
          - "!env"
      when: >
        inventory_hostname in (groups.get('linux_hosts', []) + groups.get('mac_hosts', []))
      tags:
        - always

    - name: Gather Windows facts securely
      ansible.windows.setup:
      when: inventory_hostname in groups.get('windows_hosts', [])
      tags:
        - always

    - name: Validate Confluence API token
      ansible.builtin.assert:
        that:
          - confluence_api_token | length > 0
        fail_msg: "CONFLUENCE_API_TOKEN is not set."
        success_msg: "Confluence API token is available."
      tags:
        - always

  tasks:
    - name: Determine platform label
      ansible.builtin.set_fact:
        platform_label: >-
          {% if inventory_hostname in groups.get('windows_hosts', []) %}
          Windows
          {% elif inventory_hostname in groups.get('mac_hosts', []) %}
          macOS
          {% elif inventory_hostname in groups.get('linux_hosts', []) %}
          Linux
          {% else %}
          Unknown
          {% endif %}
      tags:
        - publish

    - name: Build infrastructure documentation
      ansible.builtin.set_fact:
        documentation_html: |
          <h1>{{ confluence_page_title }}</h1>

          <h2>System Overview</h2>

          <table>
            <tbody>
              <tr>
                <th>Inventory Name</th>
                <td>{{ inventory_hostname }}</td>
              </tr>
              <tr>
                <th>Platform</th>
                <td>{{ platform_label | trim }}</td>
              </tr>
              <tr>
                <th>Hostname</th>
                <td>{{ ansible_facts.get('hostname', ansible_facts.get('computer_name', 'Unknown')) }}</td>
              </tr>
              <tr>
                <th>FQDN</th>
                <td>{{ ansible_facts.get('fqdn', 'Unknown') }}</td>
              </tr>
              <tr>
                <th>Operating System</th>
                <td>
                  {% if inventory_hostname in groups.get('windows_hosts', []) %}
                    {{ ansible_facts.get('distribution', ansible_facts.get('os_name', 'Windows')) }}
                    {{ ansible_facts.get('distribution_version', ansible_facts.get('os_version', '')) }}
                  {% else %}
                    {{ ansible_facts.get('distribution', ansible_facts.get('system', 'Unknown')) }}
                    {{ ansible_facts.get('distribution_version', ansible_facts.get('product_version', '')) }}
                  {% endif %}
                </td>
              </tr>
              <tr>
                <th>OS Family</th>
                <td>{{ ansible_facts.get('os_family', 'Unknown') }}</td>
              </tr>
              <tr>
                <th>Architecture</th>
                <td>{{ ansible_facts.get('architecture', ansible_facts.get('machine', 'Unknown')) }}</td>
              </tr>
              <tr>
                <th>Kernel</th>
                <td>{{ ansible_facts.get('kernel', 'Unknown') }}</td>
              </tr>
              <tr>
                <th>Processor Count</th>
                <td>{{ ansible_facts.get('processor_count', ansible_facts.get('processor_cores', 'Unknown')) }}</td>
              </tr>
              <tr>
                <th>Virtual CPUs</th>
                <td>{{ ansible_facts.get('processor_vcpus', ansible_facts.get('processor_threads_per_core', 'Unknown')) }}</td>
              </tr>
              <tr>
                <th>Total Memory (MB)</th>
                <td>{{ ansible_facts.get('memtotal_mb', ansible_facts.get('total_memory_mb', 'Unknown')) }}</td>
              </tr>
              <tr>
                <th>Virtualization Type</th>
                <td>{{ ansible_facts.get('virtualization_type', 'Unknown') }}</td>
              </tr>
              <tr>
                <th>Virtualization Role</th>
                <td>{{ ansible_facts.get('virtualization_role', 'Unknown') }}</td>
              </tr>
            </tbody>
          </table>

          <p>
            Documentation automatically generated using Ansible and the
            Capstone Documentation Automation System.
          </p>
      tags:
        - publish

    - name: Test connection to Confluence
      ansible.builtin.uri:
        url: "{{ confluence_base_url }}api/v2/pages"
        method: GET
        url_username: "{{ confluence_email }}"
        url_password: "{{ confluence_api_token }}"
        force_basic_auth: true
        return_content: false
        status_code: 200
      delegate_to: localhost
      register: confluence_connection
      no_log: true
      tags:
        - check_connection

    - name: Confirm Confluence authentication
      ansible.builtin.debug:
        msg: "Successfully authenticated with Confluence."
      when: confluence_connection.status == 200
      tags:
        - check_connection

    - name: Check whether system documentation already exists
      ansible.builtin.uri:
        url: "{{ confluence_base_url }}rest/api/content/search?cql={{ confluence_cql | urlencode }}&expand=version"
        method: GET
        url_username: "{{ confluence_email }}"
        url_password: "{{ confluence_api_token }}"
        force_basic_auth: true
        return_content: true
        status_code: 200
      delegate_to: localhost
      register: page_search
      no_log: true
      tags:
        - check_page
        - publish

    - name: Report page search result
      ansible.builtin.debug:
        msg: >-
          Documentation page {{
            'already exists and will be updated.'
            if page_search.json.size | int > 0
            else 'does not exist and will be created.'
          }}
      tags:
        - check_page
        - publish

    - name: Save existing Confluence page ID
      ansible.builtin.set_fact:
        existing_page_id: "{{ page_search.json.results[0].id }}"
      when: page_search.json.size | int > 0
      tags:
        - publish

    - name: Get existing Confluence page version
      ansible.builtin.uri:
        url: "{{ confluence_base_url }}{{ confluence_api_endpoint }}{{ existing_page_id }}?expand=version"
        method: GET
        url_username: "{{ confluence_email }}"
        url_password: "{{ confluence_api_token }}"
        force_basic_auth: true
        return_content: true
        status_code: 200
      delegate_to: localhost
      register: existing_page
      when: page_search.json.size | int > 0
      no_log: true
      tags:
        - publish

    - name: Create documentation page
      ansible.builtin.uri:
        url: "{{ confluence_base_url }}{{ confluence_api_endpoint }}"
        method: POST
        url_username: "{{ confluence_email }}"
        url_password: "{{ confluence_api_token }}"
        force_basic_auth: true
        headers:
          Content-Type: application/json
          Accept: application/json
        body_format: json
        body:
          type: page
          title: "{{ confluence_page_title }}"
          space:
            key: "{{ confluence_space }}"
          body:
            storage:
              representation: storage
              value: "{{ documentation_html }}"
        status_code:
          - 200
          - 201
        return_content: true
      delegate_to: localhost
      register: page_created
      when: page_search.json.size | int == 0
      no_log: true
      tags:
        - publish

    - name: Report page creation
      ansible.builtin.debug:
        msg: "Created Confluence page: {{ confluence_page_title }}"
      when:
        - page_created is defined
        - page_created is not skipped
      tags:
        - publish

    - name: Update existing documentation page
      ansible.builtin.uri:
        url: "{{ confluence_base_url }}{{ confluence_api_endpoint }}{{ existing_page_id }}"
        method: PUT
        url_username: "{{ confluence_email }}"
        url_password: "{{ confluence_api_token }}"
        force_basic_auth: true
        headers:
          Content-Type: application/json
          Accept: application/json
        body_format: json
        body:
          type: page
          title: "{{ confluence_page_title }}"
          space:
            key: "{{ confluence_space }}"
          body:
            storage:
              representation: storage
              value: "{{ documentation_html }}"
          version:
            number: "{{ existing_page.json.version.number | int + 1 }}"
        status_code:
          - 200
          - 201
        return_content: true
      delegate_to: localhost
      register: page_updated
      when: page_search.json.size | int > 0
      no_log: true
      tags:
        - publish

    - name: Report page update
      ansible.builtin.debug:
        msg: "Updated Confluence page: {{ confluence_page_title }}"
      when:
        - page_updated is defined
        - page_updated is not skipped
      tags:
        - publish

    - name: Show documentation summary
      ansible.builtin.debug:
        msg:
          - "System: {{ inventory_hostname }}"
          - "Platform: {{ platform_label | trim }}"
          - "Page: {{ confluence_page_title }}"
          - "Space: {{ confluence_space }}"
          - "Confluence URL: {{ confluence_base_url }}"
      tags:
        - publish
        